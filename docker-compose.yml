name: architech

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: architech
      POSTGRES_PASSWORD: architech
      POSTGRES_DB: architech
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architech -d architech"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible stand-in for Cloudflare R2 during local development.
  # Buckets are created by the app on startup (scripts/dev.mjs).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
  s3data:
