<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HomeRedo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f2; color: #1d2a24; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: #6b746f; margin: 0 0 24px; font-size: 17px; line-height: 1.4; }
      button { height: 56px; padding: 0 28px; border: 0; border-radius: 16px; background: #1f4d3a; color: #fff; font-size: 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach HomeRedo</h1>
      <p>Check your internet connection.<br />If you're testing at home, make sure the computer running HomeRedo is on and on the same Wi-Fi.</p>
      <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    </main>
  </body>
</html>
